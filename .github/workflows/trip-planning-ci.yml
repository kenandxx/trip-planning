name: Trip Planning CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trip-planning-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project structure and source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run project validation
        run: bash scripts/validate-trip-project.sh
